<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>BTP Carnage</title>
    <!-- Refonte UI 16-bit premium : titres = Jersey 25, UI = Pixelify Sans.
         Polices AUTO-HÉBERGÉES (public/fonts.css + public/fonts/*.woff2) — AUCUNE
         dépendance CDN externe : marche hors-ligne et sur réseau restreint (le CDN
         Google Fonts était bloqué → titre/polices cassés sur certains PC). -->
    <link rel="stylesheet" href="/fonts.css" />
    <style>
      /* Safe areas (encoches/coins arrondis) : source CSS unique, lue par le
         ViewportBus (src/ui/viewport.ts) et consommable par tout le HUD. */
      :root {
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-r: env(safe-area-inset-right, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-l: env(safe-area-inset-left, 0px);
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1a1a1a;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #game-root {
        position: relative;
        width: 100vw;
        height: 100vh;   /* repli navigateurs anciens */
        height: 100dvh;  /* viewport DYNAMIQUE : suit les barres du navigateur mobile */
      }
      /* L'overlay UI (HUD, menus) vit ici, au-dessus du canvas Phaser. */
      #ui-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game-root">
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
